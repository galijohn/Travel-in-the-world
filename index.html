<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המסע שלנו בעולם</title>
<!-- Drive serves photos to embedding pages only without a referrer -->
<meta name="referrer" content="no-referrer">
<meta name="description" content="גלובוס של כל המקומות שהיינו בהם — יחד ולחוד">
<link rel="icon" href="icons/map-192.png">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/map-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="המסע שלנו">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070f;
    --panel: rgba(14, 18, 34, 0.82);
    --border: rgba(255, 255, 255, 0.1);
    --text: #eef1ff;
    --muted: #9aa3c7;
    --me: #4cc9f0;
    --partner: #f72585;
    --together: #ffd166;
    --separate: #b388ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Rubik", system-ui, sans-serif;
  }
  #globe { position: fixed; inset: 0; }

  .panel {
    position: fixed;
    top: 16px; right: 16px;
    width: 320px;
    max-height: calc(100% - 32px);
    display: flex; flex-direction: column;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    z-index: 2;
  }
  header { padding: 18px 18px 10px; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; }
  .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; padding: 6px 18px 12px;
  }
  .stat {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 6px; text-align: center;
  }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.together b { color: var(--together); }
  .stat.me b { color: var(--me); }
  .stat.partner b { color: var(--partner); }

  .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
  .filters button {
    font: inherit; font-size: 13px;
    color: var(--text);
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .filters button[aria-pressed="true"] { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  .list { overflow-y: auto; padding: 0 10px 12px; border-top: 1px solid var(--border); }
  .list h2 { font-size: 12px; color: var(--muted); font-weight: 500; margin: 12px 8px 6px; letter-spacing: .03em; }
  .item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: right;
    font: inherit; color: var(--text);
    background: none; border: 0; border-radius: 10px;
    padding: 8px; cursor: pointer;
  }
  .item:hover, .item:focus-visible { background: rgba(255,255,255,0.07); outline: none; }
  .item .meta { color: var(--muted); font-size: 12px; margin-inline-start: auto; white-space: nowrap; }

  .card {
    position: fixed;
    left: 16px; bottom: 16px;
    width: 340px; max-width: calc(100% - 32px);
    max-height: 70%;
    overflow-y: auto;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px 18px;
    z-index: 3;
    display: none;
  }
  .card.open { display: block; }
  .card h3 { margin: 0 0 4px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .card .who { font-size: 13px; color: var(--muted); }
  .card p { margin: 10px 0 0; line-height: 1.5; }
  .card .close {
    position: absolute; top: 10px; left: 10px;
    background: none; border: 0; color: var(--muted);
    font-size: 22px; cursor: pointer; line-height: 1;
  }
  button.album { border: 0; cursor: pointer; font-family: inherit; }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .strip button, .grid button {
    position: relative; padding: 0; border: 0; border-radius: 8px; overflow: hidden;
    width: 100%; height: auto; aspect-ratio: 1; align-self: start;
    background: rgba(255,255,255,0.06); cursor: pointer;
  }
  .strip img, .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip .more {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); color: #fff; font-size: 18px; font-weight: 700;
  }
  .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,.7); pointer-events: none;
  }
  .album {
    display: inline-block; margin-top: 12px;
    color: var(--bg); background: var(--together);
    padding: 7px 14px; border-radius: 999px;
    text-decoration: none; font-weight: 500; font-size: 14px;
  }

  .gallery {
    position: fixed; inset: 0; z-index: 8; background: rgba(5,7,15,0.97);
    display: none; flex-direction: column;
  }
  .gallery.open { display: flex; }
  .gallery header {
    display: flex; align-items: center; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
  }
  .gallery h3 { margin: 0; font-size: 20px; flex: 1; }
  .gallery .count { color: var(--muted); font-size: 14px; }
  .icon-btn {
    background: rgba(255,255,255,0.1); border: 0; color: var(--text);
    width: 40px; height: 40px; border-radius: 50%; font-size: 22px; cursor: pointer; flex: none;
  }
  .grid {
    flex: 1; overflow-y: auto; padding: 0 18px calc(18px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: max-content; gap: 8px; align-content: start;
  }

  .viewer {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: none; align-items: center; justify-content: center;
  }
  .viewer.open { display: flex; }
  .viewer .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .viewer iframe { width: min(100%, 1100px); height: min(100%, 80vh); border: 0; }
  .viewer .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.12); border: 0; color: #fff;
    width: 48px; height: 48px; border-radius: 50%; font-size: 26px; cursor: pointer;
  }
  .viewer .prev { right: 14px; }
  .viewer .next { left: 14px; }
  .viewer .top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
    background: linear-gradient(rgba(0,0,0,.6), transparent); color: #fff; font-size: 14px;
  }

  .tooltip {
    font-family: "Rubik", system-ui, sans-serif;
    direction: rtl;
    background: rgba(10,12,24,0.9);
    border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 8px;
    font-size: 13px; color: var(--text);
  }

  .toggle-panel { display: none; }

  @media (max-width: 700px) {
    .panel {
      top: auto; bottom: 0; right: 0; left: 0;
      width: 100%;
      max-height: 55%;
      border-radius: 18px 18px 0 0;
      transition: transform .25s ease;
    }
    .panel { padding-bottom: env(safe-area-inset-bottom); }
    .panel.collapsed { transform: translateY(calc(100% - 132px - env(safe-area-inset-bottom))); }
    header { padding: 12px 16px 6px; }
    h1 { font-size: 18px; }
    .stats, .filters { padding-left: 16px; padding-right: 16px; }
    .toggle-panel {
      display: block; margin: 6px auto 0;
      width: 44px; height: 5px; border: 0; padding: 0;
      background: rgba(255,255,255,0.3); border-radius: 3px; cursor: pointer;
    }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 4px; }
    .viewer .nav { display: none; }
    .card { left: 16px; right: 16px; width: auto; top: calc(16px + env(safe-area-inset-top)); bottom: auto; max-height: 40%; }
  }
</style>
</head>
<body>
<div id="globe" aria-label="גלובוס אינטראקטיבי"></div>

<aside class="panel collapsed" id="panel">
  <button class="toggle-panel" id="togglePanel" aria-label="פתח/סגור רשימה"></button>
  <header>
    <h1>המסע שלנו בעולם 🌍</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</aside>

<div class="card" id="card" role="dialog" aria-live="polite"></div>
<div class="gallery" id="gallery" role="dialog" aria-modal="true">
  <header>
    <button class="icon-btn" id="galleryClose" aria-label="סגירה">×</button>
    <h3 id="galleryTitle"></h3>
    <span class="count" id="galleryCount"></span>
  </header>
  <div class="grid" id="galleryGrid"></div>
</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <div class="stage" id="viewerStage"></div>
  <div class="top"><span id="viewerCount"></span><button class="icon-btn" id="viewerClose" aria-label="סגירה">×</button></div>
  <button class="nav prev" id="viewerPrev" aria-label="הקודמת">›</button>
  <button class="nav next" id="viewerNext" aria-label="הבאה">‹</button>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
<script src="assets/common.js"></script>
<script>
(async () => {
  const { asList, category, aggregateCountries, countryName, centroid, hexA, esc } = TravelCommon;
  const [T, countryFeatures, media] = await Promise.all([
    TravelCommon.loadSiteData(),
    TravelCommon.loadCountries(),
    // photo lists per Drive folder, built by .github/workflows/media.yml
    fetch("data/media.json?v=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  ]);
  const P = T.people;
  const catInfo = c => TravelCommon.catInfo(P, c);
  const whoLabel = who => TravelCommon.whoLabel(P, who);

  const countryWho = aggregateCountries(T);
  const places = T.places.map(p => ({ ...p, cat: category(new Set(asList(p.who))) }));

  // --- UI state ------------------------------------------------------------
  // filter: "all" | "together" | "me" | "partner"
  // "me" = everywhere I was (with or without her); same for "partner"
  let filter = "all";
  const visible = whoSet => {
    if (filter === "all") return true;
    if (filter === "together") return whoSet.has("together");
    return whoSet.has(filter) || whoSet.has("together");
  };

  // --- globe ---------------------------------------------------------------
  const el = document.getElementById("globe");
  const globe = Globe()(el)
    .polygonSideColor(() => "rgba(0,0,0,0.15)")
    .polygonStrokeColor(() => "rgba(255,255,255,0.25)")
    .polygonsTransitionDuration(400)
    .polygonLabel(f => {
      const set = countryWho.get(f.properties.code);
      const name = countryName(f.properties);
      if (!set) return `<div class="tooltip">${esc(name)}</div>`;
      return `<div class="tooltip"><b>${esc(name)}</b><br>${esc(catInfo(category(set)).name)}</div>`;
    })
    .onPolygonClick(f => {
      if (countryWho.has(f.properties.code)) showCountry(f.properties);
    })
    .pointLat("lat").pointLng("lng")
    .pointAltitude(0.02)
    .pointRadius(0.45)
    .pointColor(p => catInfo(p.cat).color)
    .pointLabel(p => `<div class="tooltip"><b>${esc(p.name)}</b><br>${esc(whoLabel(p.who))}${p.date ? " · " + esc(p.date) : ""}</div>`)
    .onPointClick(p => showPlace(p))
    .ringLat("lat").ringLng("lng")
    .ringColor(p => t => hexA(catInfo(p.cat).color, 1 - t))
    .ringMaxRadius(3)
    .ringPropagationSpeed(1.5)
    .ringRepeatPeriod(1600);

  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.35;
  el.addEventListener("pointerdown", () => { globe.controls().autoRotate = false; }, { once: true });
  TravelCommon.realisticGlobe(globe);
  globe.pointOfView({ lat: 32, lng: 35, altitude: 2.3 });

  const onResize = () => globe.width(innerWidth).height(innerHeight);
  addEventListener("resize", onResize);
  onResize();

  function polyColor(f) {
    const set = countryWho.get(f.properties.code);
    if (!set || !visible(set)) return "rgba(0,0,0,0)";
    return hexA(catInfo(category(set)).color, 0.45);
  }

  function render() {
    globe
      .polygonsData(countryFeatures)
      .polygonCapColor(polyColor)
      .polygonAltitude(f => {
        const set = countryWho.get(f.properties.code);
        return set && visible(set) ? 0.012 : 0.004;
      });
    const pts = places.filter(p => visible(new Set(asList(p.who))));
    globe.pointsData(pts).ringsData(pts.filter(p => p.cat === "together"));
    renderList();
  }

  // --- side panel ----------------------------------------------------------
  const countsFor = key => [...countryWho.values()].filter(s =>
    key === "together" ? s.has("together") : (s.has(key) || s.has("together"))).length;

  document.getElementById("subtitle").textContent =
    `${countryWho.size} מדינות · ${places.length} מקומות`;

  document.getElementById("stats").innerHTML = [
    ["together", P.together.name],
    ["me", P.me.name],
    ["partner", P.partner.name],
  ].map(([k, n]) => `<div class="stat ${k}"><b>${countsFor(k)}</b><span>מדינות · ${esc(n)}</span></div>`).join("");

  const filtersEl = document.getElementById("filters");
  const filterDefs = [
    ["all", "הכל", null],
    ["together", P.together.name, P.together.color],
    ["me", P.me.name, P.me.color],
    ["partner", P.partner.name, P.partner.color],
  ];
  filtersEl.innerHTML = filterDefs.map(([k, n, c]) =>
    `<button data-f="${k}" aria-pressed="${k === filter}">${c ? `<span class="dot" style="background:${c}"></span>` : ""}${esc(n)}</button>`
  ).join("");
  filtersEl.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    filtersEl.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });

  function renderList() {
    const listEl = document.getElementById("list");
    const visCountries = [...countryWho.entries()]
      .filter(([, s]) => visible(s))
      .map(([code, s]) => ({ code, set: s, props: countryProps(code) }))
      .sort((a, b) => countryName(a.props).localeCompare(countryName(b.props), "he"));
    const visPlaces = places.filter(p => visible(new Set(asList(p.who))))
      .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

    listEl.innerHTML =
      `<h2>מקומות (${visPlaces.length})</h2>` +
      visPlaces.map(p => `<button class="item" data-p="${places.indexOf(p)}">
          <span class="dot" style="background:${catInfo(p.cat).color}"></span>${esc(p.name)}
          <span class="meta">${esc(p.date || "")}</span></button>`).join("") +
      `<h2>מדינות (${visCountries.length})</h2>` +
      visCountries.map(c => `<button class="item" data-c="${c.code}">
          <span class="dot" style="background:${catInfo(category(c.set)).color}"></span>${esc(countryName(c.props))}
          <span class="meta">${esc(catInfo(category(c.set)).name)}</span></button>`).join("");
  }

  document.getElementById("list").addEventListener("click", e => {
    const b = e.target.closest(".item"); if (!b) return;
    if (b.dataset.p) showPlace(places[+b.dataset.p]);
    else showCountry(countryProps(b.dataset.c));
  });

  const panel = document.getElementById("panel");
  document.getElementById("togglePanel").addEventListener("click", () => panel.classList.toggle("collapsed"));

  // --- details card --------------------------------------------------------
  const card = document.getElementById("card");

  function showPlace(p) {
    flyTo(p.lat, p.lng, 0.9);
    openCard(`
      <h3><span class="dot" style="background:${catInfo(p.cat).color}"></span>${esc(p.name)}</h3>
      <div class="who">${esc(whoLabel(p.who))}${p.date ? " · " + esc(p.date) : ""}${p.code ? " · " + esc(countryName(countryProps(p.code))) : ""}</div>
      ${p.note ? `<p>${esc(p.note)}</p>` : ""}
      ${albumSlot(p.album, p.name)}`);
  }

  function showCountry(props) {
    const set = countryWho.get(props.code);
    const f = countryFeatures.find(f => f.properties.code === props.code);
    if (f) { const c = centroid(f); flyTo(c.lat, c.lng, 1.6); }
    const inside = places.filter(p => p.code === props.code);
    const meta = T.countries.find(x => x.code === props.code) || {};
    openCard(`
      <h3><span class="dot" style="background:${catInfo(category(set)).color}"></span>${esc(countryName(props))}</h3>
      <div class="who">${esc(catInfo(category(set)).name)}</div>
      ${meta.note ? `<p>${esc(meta.note)}</p>` : ""}
      ${inside.length ? `<div class="list" style="border:0;padding:6px 0 0">${inside.map(p =>
        `<button class="item" data-p="${places.indexOf(p)}"><span class="dot" style="background:${catInfo(p.cat).color}"></span>${esc(p.name)}<span class="meta">${esc(p.date || "")}</span></button>`).join("")}</div>` : ""}
      ${albumSlot(meta.album, countryName(props))}`);
  }

  // --- photos: shown from the shared Drive folder, inside the map -----------
  const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
  let galleryItems = [], viewerIndex = 0;

  // Photos of a Drive folder. With a Google API key (set in the editor) they are read live
  // from Drive; otherwise, or if that fails, from data/media.json built by the GitHub Action.
  const mediaCache = new Map();
  function folderMedia(url) {
    const id = TravelCommon.driveFolderId(url);
    if (!id) return Promise.resolve([]);
    if (!mediaCache.has(id)) {
      const fallback = () => media[id] || [];
      mediaCache.set(id, T.googleApiKey ? listDriveFolder(id).catch(fallback) : Promise.resolve(fallback()));
    }
    return mediaCache.get(id);
  }

  async function listDriveFolder(id, depth = 0) {
    const items = [];
    let pageToken = "";
    do {
      const q = encodeURIComponent(`'${id}' in parents and trashed = false`);
      const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,mimeType)&pageSize=1000&orderBy=name&key=${encodeURIComponent(T.googleApiKey)}${pageToken ? "&pageToken=" + pageToken : ""}`;
      // the key is restricted to this site, so this request must carry the page's origin
      const r = await fetch(url, { referrerPolicy: "strict-origin-when-cross-origin" });
      if (!r.ok) throw new Error("Drive " + r.status);
      const j = await r.json();
      for (const f of j.files) {
        if (f.mimeType === "application/vnd.google-apps.folder") { if (depth < 2) items.push(...await listDriveFolder(f.id, depth + 1)); }
        else if (f.mimeType.startsWith("image/")) items.push({ id: f.id, name: f.name });
        else if (f.mimeType.startsWith("video/")) items.push({ id: f.id, name: f.name, video: true });
      }
      pageToken = j.nextPageToken || "";
    } while (pageToken);
    return depth ? items : items.sort((a, b) => a.name.localeCompare(b.name));
  }

  // the card opens at once; its photos fill in when the list arrives
  function albumSlot(url, title) {
    if (!url) return "";
    folderMedia(url).then(items => {
      const slot = card.querySelector(".album-slot");
      if (slot && slot.dataset.album === url) slot.innerHTML = albumHtml(url, title, items);
    });
    return `<div class="album-slot" data-album="${esc(url)}"><div class="strip">${"<button disabled></button>".repeat(4)}</div></div>`;
  }

  function albumHtml(url, title, items) {
    // folder not listed (not shared, or just added without a key): fall back to opening Drive
    if (!items.length) return `<a class="album" href="${esc(url)}" target="_blank" rel="noopener">📷 לתמונות מהטיול</a>`;
    const preview = items.slice(0, 4).map((m, i) => `<button data-open="${i}" aria-label="תמונה ${i + 1}">
        <img src="${thumb(m.id, 300)}" loading="lazy" alt="">${m.video ? `<span class="play">▶</span>` : ""}
        ${i === 3 && items.length > 4 ? `<span class="more">+${items.length - 3}</span>` : ""}</button>`).join("");
    return `<div class="strip" data-album="${esc(url)}" data-title="${esc(title)}">${preview}</div>
      <button class="album" data-gallery="${esc(url)}" data-title="${esc(title)}">📷 כל התמונות (${items.length})</button>`;
  }

  async function openGallery(url, title) {
    galleryItems = await folderMedia(url);
    document.getElementById("galleryTitle").textContent = title;
    document.getElementById("galleryCount").textContent = `${galleryItems.length} תמונות וסרטונים`;
    document.getElementById("galleryGrid").innerHTML = galleryItems.map((m, i) =>
      `<button data-i="${i}"><img src="${thumb(m.id, 400)}" loading="lazy" alt="">${m.video ? `<span class="play">▶</span>` : ""}</button>`).join("");
    document.getElementById("gallery").classList.add("open");
  }

  function openViewer(i) {
    viewerIndex = (i + galleryItems.length) % galleryItems.length;
    const m = galleryItems[viewerIndex];
    document.getElementById("viewerStage").innerHTML = m.video
      ? `<iframe src="https://drive.google.com/file/d/${encodeURIComponent(m.id)}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`
      : `<img src="${thumb(m.id, 2000)}" alt="">`;
    document.getElementById("viewerCount").textContent = `${viewerIndex + 1} מתוך ${galleryItems.length}`;
    document.getElementById("viewer").classList.add("open");
    // warm up the next photo so swiping feels instant
    const next = galleryItems[(viewerIndex + 1) % galleryItems.length];
    if (next && !next.video) new Image().src = thumb(next.id, 2000);
  }

  const closeViewer = () => { document.getElementById("viewer").classList.remove("open"); document.getElementById("viewerStage").innerHTML = ""; };
  document.getElementById("galleryClose").onclick = () => document.getElementById("gallery").classList.remove("open");
  document.getElementById("galleryGrid").addEventListener("click", e => {
    const b = e.target.closest("button[data-i]"); if (b) openViewer(+b.dataset.i);
  });
  document.getElementById("viewerClose").onclick = closeViewer;
  document.getElementById("viewerPrev").onclick = () => openViewer(viewerIndex - 1);
  document.getElementById("viewerNext").onclick = () => openViewer(viewerIndex + 1);
  // swipe on phones (RTL: swiping left goes back)
  let touchX = null;
  const viewerEl = document.getElementById("viewer");
  viewerEl.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  viewerEl.addEventListener("touchend", e => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 50) openViewer(viewerIndex + (dx > 0 ? 1 : -1));
  });

  function openCard(html) {
    card.innerHTML = `<button class="close" aria-label="סגור">×</button>` + html;
    card.classList.add("open");
    globe.controls().autoRotate = false;
  }
  card.addEventListener("click", e => {
    if (e.target.closest(".close")) return card.classList.remove("open");
    const item = e.target.closest(".item[data-p]");
    if (item) return showPlace(places[+item.dataset.p]);
    const all = e.target.closest("[data-gallery]");
    if (all) return openGallery(all.dataset.gallery, all.dataset.title);
    const one = e.target.closest(".strip [data-open]");
    if (one) {
      const strip = one.closest(".strip");
      openGallery(strip.dataset.album, strip.dataset.title).then(() => openViewer(+one.dataset.open));
    }
  });
  addEventListener("keydown", e => {
    const viewerOpen = viewerEl.classList.contains("open");
    if (viewerOpen && e.key === "ArrowLeft") return openViewer(viewerIndex + 1);
    if (viewerOpen && e.key === "ArrowRight") return openViewer(viewerIndex - 1);
    if (e.key !== "Escape") return;
    if (viewerOpen) closeViewer();
    else if (document.getElementById("gallery").classList.contains("open")) document.getElementById("gallery").classList.remove("open");
    else card.classList.remove("open");
  });

  // --- helpers -------------------------------------------------------------
  function flyTo(lat, lng, altitude) {
    globe.controls().autoRotate = false;
    globe.pointOfView({ lat, lng, altitude }, 1200);
  }
  function countryProps(code) {
    const f = countryFeatures.find(f => f.properties.code === code);
    return f ? f.properties : { code, iso2: "", name: code };
  }

  render();
})();
</script>
<script>
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
